[package]
name = "talk"
version = "0.12.0"
description = "Talk, a Speech-to-Text desktop client"
authors = ["avpbynf"]
edition = "2021"

[lib]
name = "talk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# The updater reads the release feed and runs the installer it downloads; process
# restarts the application in the case where the installer has not done it itself.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Whisper transcription (with optional GPU/NPU acceleration)
# raw-api re-exports whisper-rs-sys, which is how the GPU list is read: the ggml
# device registry names the cards in the order gpu_device indexes them.
whisper-rs = { version = "0.16", features = ["raw-api"] }

# Audio capture & playback
cpal = "0.15"
rodio = "0.20"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP for model download and server transcription
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }

# WAV encoding for server transcription
hound = "3.5"

# Utilities
directories = "5"
rusqlite = { version = "0.34", features = ["bundled"] }
thiserror = "1"
parking_lot = "0.12"
dotenvy = "0.15"
url = "2"
# Finds Talk-Server on the local network; the browse runs on its own thread.
mdns-sd = "0.21"
# Share this PC: the HTTP API other machines dictate through. symphonia was
# already here for the sounds, and now decodes the WAV they upload.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "tokio"] }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm"] }
if-addrs = "0.15"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
base64 = "0.22"
# Both were already in the tree through tauri, so declaring them costs no
# extra compilation. They are what lets the recording path stamp a row
# itself rather than handing the job to the frontend.
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.2", default-features = false, features = ["x11rb"] }
keyring = { version = "3", features = ["linux-native-sync-persistent"] }
# Windows clipboard/input
[target.'cfg(windows)'.dependencies]
enigo = "0.2"
clipboard-win = "5"
# The Google refresh token lives in the Windows Credential Manager.
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62", features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[features]
default = ["vulkan"]
vulkan = ["whisper-rs/vulkan"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

